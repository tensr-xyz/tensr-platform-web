name: Live e2e

# Against the development preview alias and the dev API. Not part of pull-request CI.
# Sign-in uses the Stytch test secret (sandbox@stytch.com / 000000) server-side.
# The preview is behind Vercel deployment protection; the bypass header is required.
on:
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test -c playwright.live.config.ts
        env:
          PLAYWRIGHT_LIVE_BASE_URL: https://tensr-platform-web-git-development-tensr.vercel.app
          PLAYWRIGHT_LIVE_API_URL: https://5qv9lg3s55.execute-api.us-east-1.amazonaws.com
          STYTCH_PROJECT_ID: ${{ secrets.STYTCH_PROJECT_ID }}
          STYTCH_SECRET: ${{ secrets.STYTCH_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
