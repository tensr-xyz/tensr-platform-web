name: CI — menu catalog

on:
  pull_request:
  push:
    branches: [main, development]

permissions:
  contents: read

jobs:
  menu-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install

      - name: Production menu contract (Jest)
        run: pnpm run test:menu-catalog
