name: CI — e2e

on:
  pull_request:
  push:
    branches: [main, development]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Runs playwright.config.ts (workspace, analysis, chat) then playwright.auth.config.ts.
      - name: Playwright
        run: pnpm run test
        env:
          # Specs intercept every Stytch and tensr-api call, so a placeholder token is
          # enough; without one the app renders its configuration-error screen.
          NEXT_PUBLIC_STYTCH_PUBLIC_TOKEN: public-token-test-00000000-0000-0000-0000-000000000000

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
