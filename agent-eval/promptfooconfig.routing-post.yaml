# Post-rewrite (§4.2) — behavioral expectations for the agent loop.
# Offline provider maps prompts → expected policy outcomes without calling the LLM.
# Live LLM eval can swap the provider to hit POST /assistant/agent-loop when credentials exist.
description: Tensr agent loop post-rewrite policy expectations (Ask / Plan / Agent)

providers:
  - file://promptfoo-provider-agent-loop-policy.cjs

tests:
  # Former tutor-fallthroughs must NOT stay "tutor" in Agent mode — clarify or tool.
  - vars: { prompt: 'Hello', mode: agent }
    assert: [{ type: equals, value: 'text-or-clarify' }]

  - vars: { prompt: 'What does Age mean?', mode: agent }
    assert: [{ type: equals, value: 'tool-or-clarify' }]
    description: 'Must not false-positive into silent aggregate; read_data or clarify'

  - vars: { prompt: 'How do I interpret a p-value?', mode: agent }
    assert: [{ type: equals, value: 'text-or-clarify' }]

  - vars: { prompt: 'run one for me', mode: agent }
    assert: [{ type: equals, value: 'clarify' }]

  - vars: { prompt: 'why is that significant?', mode: agent }
    assert: [{ type: equals, value: 'text-or-clarify' }]

  - vars: { prompt: 'Can you help me understand the groups?', mode: agent }
    assert: [{ type: equals, value: 'text-or-clarify' }]

  - vars: { prompt: 't test for me on my dataset', mode: agent }
    assert: [{ type: equals, value: 'run_analysis' }]

  - vars: { prompt: 'correlation between Age and PTS', mode: agent }
    assert: [{ type: equals, value: 'run_analysis' }]

  - vars: { prompt: 'How many members joined after 2024?', mode: agent }
    assert: [{ type: equals, value: 'run_analysis' }]

  - vars: { prompt: 'Sum of Revenue by Region', mode: agent }
    assert: [{ type: equals, value: 'run_analysis' }]

  - vars: { prompt: 'Make a monthly line chart', mode: agent }
    assert: [{ type: equals, value: 'run_analysis' }]

  - vars: { prompt: "What's interesting?", mode: agent }
    assert: [{ type: equals, value: 'tool-or-clarify' }]

  - vars: { prompt: 'Where do I start?', mode: agent }
    assert: [{ type: equals, value: 'tool-or-clarify' }]

  - vars: { prompt: 'Clean this dataset', mode: agent }
    assert: [{ type: equals, value: 'start_prep_playbook' }]

  - vars: { prompt: 'Run a data quality scan', mode: agent }
    assert: [{ type: equals, value: 'run_data_quality_scan' }]

  - vars: { prompt: 'I want percentile values for utilisation_rate', mode: agent }
    assert: [{ type: equals, value: 'run_analysis' }]

  # Ask mode — write-capable requests must not execute
  - vars: { prompt: 't test for me on my dataset', mode: ask }
    assert: [{ type: equals, value: 'ask-no-write' }]

  - vars: { prompt: 'Clean this dataset', mode: ask }
    assert: [{ type: equals, value: 'ask-no-write' }]

  # Plan mode — write-capable → awaiting approval
  - vars: { prompt: 't test for me on my dataset', mode: plan }
    assert: [{ type: equals, value: 'plan-awaiting-approval' }]

  # Fidelity — must refuse wrong statistic, not substitute
  - vars: { prompt: 'geometric mean of Revenue', mode: agent }
    assert: [{ type: equals, value: 'refuse-or-clarify' }]
